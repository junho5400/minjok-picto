<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sangmo pictogram</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">QuiverAI · Arrow 2.0</p>
        <h1>Sangmo spinning pictogram</h1>
        <p class="lede">
          Stroke-based Korean folk mark: one pungmul dancer, sangmo hat, and a
          looping ribbon. Generated to match the reference’s monoline maroon on
          pale pink.
        </p>
      </header>
      <figure class="mark mark-sangmo">
        <img
          src="/sangmo-pictogram.svg"
          alt="Abstract line drawing of a Korean pungmul dancer spinning a sangmo ribbon"
          width="320"
          height="386"
        />
        <figcaption>public/sangmo-pictogram.svg</figcaption>
      </figure>
      <p class="sizes">
        <img src="/sangmo-pictogram.svg" alt="" width="24" height="29" />
        <img src="/sangmo-pictogram.svg" alt="" width="48" height="58" />
        <img src="/sangmo-pictogram.svg" alt="" width="96" height="116" />
      </p>

      <section class="prior">
        <h2>Earlier mark</h2>
        <p>
          Olympic-style swimming pictogram from Arrow 1.1, kept alongside this
          generation.
        </p>
        <img
          class="swim"
          src="/swimming-pictogram.svg"
          alt="Black swimming pictogram"
          width="96"
          height="96"
        />
      </section>
    </main>
  </body>
</html>
