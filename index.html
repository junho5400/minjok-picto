<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swimming pictogram</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <p class="eyebrow">QuiverAI · Arrow 1.1</p>
        <h1>Swimming pictogram</h1>
        <p class="lede">
          Olympic-style wayfinding mark: a single crawl-stroke figure over water
          ripples, generated as a one-color SVG.
        </p>
      </header>
      <figure class="mark">
        <img
          src="/swimming-pictogram.svg"
          alt="Black silhouette of a swimmer in freestyle stroke above wavy water lines"
          width="320"
          height="320"
        />
        <figcaption>public/swimming-pictogram.svg</figcaption>
      </figure>
      <p class="sizes">
        <img src="/swimming-pictogram.svg" alt="" width="24" height="24" />
        <img src="/swimming-pictogram.svg" alt="" width="48" height="48" />
        <img src="/swimming-pictogram.svg" alt="" width="96" height="96" />
      </p>
    </main>
  </body>
</html>
